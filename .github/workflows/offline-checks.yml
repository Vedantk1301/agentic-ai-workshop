name: Offline workshop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-instructor.txt
      - run: python -m pip install -r requirements-instructor.txt
      - run: python -m pip check
      - run: python tools/verify_workshop.py
      - run: python -m pytest classroom/tests deep-dives/demo/tests -q -p no:cacheprovider
